<!DOCTYPE html>
<html lang="tr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sınıf Akvaryumu</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef3f7;--fg:#0e2434;--card:#fff;--line:#c9d8e4;--accent:#1173a8;--shadow:0 2px 10px rgba(0,40,70,.12)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1620;--fg:#e6f0f7;--card:#16242f;--line:#2b4050;--accent:#4db6e8}}
:root[data-theme="dark"]{--bg:#0d1620;--fg:#e6f0f7;--card:#16242f;--line:#2b4050;--accent:#4db6e8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px}
h1{font-size:17px;margin:0 10px 0 0;font-weight:700}
.tabs{display:flex;gap:6px}
.tab{padding:7px 16px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;cursor:pointer;font-size:14px;font-weight:600}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.hint{font-size:13px;opacity:.7;margin-left:auto}
#tank{position:relative;margin:0 10px 10px;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);
aspect-ratio:16/9;background:#0a2438 center/cover no-repeat}
.fish{position:absolute;left:0;top:0;cursor:pointer;transform-origin:center;will-change:transform;text-align:center}
.fish img,.fish svg{display:block;width:100%;height:auto;pointer-events:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}
.fish.weak img,.fish.weak svg{filter:grayscale(.65) brightness(.75) drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.fish.hit img,.fish.hit svg{filter:drop-shadow(0 0 10px #ffe066) drop-shadow(0 0 22px #ffb703)}
.tag.zz::after{content:" 😴"}
.stat{position:absolute;left:50%;top:calc(100% + 15px);transform:translateX(-50%);white-space:nowrap;font-size:10px;font-weight:600;
padding:1px 6px;border-radius:999px;pointer-events:none}
.stat.ok{background:rgba(58,143,74,.75);color:#fff}
.stat.due{background:rgba(194,140,20,.8);color:#fff}
.stat.weak{background:rgba(150,55,55,.85);color:#fff}
#bar{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
#meter{width:70px;height:7px;border-radius:99px;background:var(--line);overflow:hidden}
#meter i{display:block;height:100%;width:0;background:#3a8f4a;transition:width .3s}
#q{width:150px;padding:7px 12px;border-radius:999px;font-size:13px}
.tag{position:absolute;left:50%;top:100%;transform:translateX(-50%);white-space:nowrap;font-size:11px;
background:rgba(0,0,0,.45);color:#fff;padding:1px 7px;border-radius:999px;pointer-events:none}
.lvl{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);white-space:nowrap;font-size:10px;color:#ffd77a;text-shadow:0 1px 2px #000;pointer-events:none}
#panel{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:flex-start;padding:16px;z-index:9}
#panel.on{display:flex}
.box{background:var(--card);border-radius:16px;padding:18px;width:min(340px,100%);box-shadow:var(--shadow);max-height:calc(100vh - 32px);overflow:auto}
.bigfish{width:100%;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#0d3350,#0a2438);border-radius:12px;margin-bottom:12px;overflow:hidden}
.bigfish img,.bigfish svg{width:82%;height:auto;filter:drop-shadow(0 6px 12px rgba(0,0,0,.4))}
.stattxt{display:inline-block;margin:6px 0 2px;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px}
.stattxt.ok{background:rgba(58,143,74,.18);color:#3a8f4a}
.stattxt.due{background:rgba(194,140,20,.18);color:#a97a12}
.stattxt.weak{background:rgba(150,55,55,.18);color:#963737}
.box h2{margin:0 0 12px;font-size:17px}
input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--fg);font-size:15px}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
button.b{flex:1;padding:11px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
button.g{background:#3a8f4a}button.r{background:#8a4040}button.n{background:transparent;color:var(--fg);border:1px solid var(--line)}
.meta{font-size:13px;opacity:.8;margin:10px 0 0}
#food{position:absolute;width:9px;height:9px;border-radius:50%;background:#ffcf66;display:none;box-shadow:0 0 8px #ffcf66}
</style></head><body>

<header>
  <h1>🐠 Sınıf Akvaryumu</h1>
  <div class="tabs" id="tabs"></div>
  <input id="q" placeholder="🔍 Balık ara...">
  <div id="bar" title="Akvaryum tokluk oranı">🍤 <span id="pct">%0</span><span id="meter"><i></i></span></div>
</header>

<div id="tank"><div id="food"></div></div>

<div id="panel"><div class="box">
  <div class="bigfish" id="pbig"></div>
  <h2 id="ptitle">Balık</h2>
  <span class="stattxt" id="pstat"></span>
  <input id="pname" placeholder="Öğrenci adı">
  <div class="meta" id="pmeta"></div>
  <div class="row">
    <button class="b g" id="feed">🍤 Yem ver (büyüsün)</button>
  </div>
  <div class="row">
    <button class="b n" id="save">Kaydet</button>
    <button class="b r" id="undo">Küçült</button>
    <button class="b n" id="close">Kapat</button>
  </div>
</div></div>

document.getElementById('tank').style.backgroundImage="url('"+BG+"')";
const CLASSES=["3-A","3-B","3-C"], N=20, MAXLVL=12;
const PAL=["#ff8a3d","#ffd23f","#4ecdc4","#ff6b6b","#c77dff","#7bdff2","#f28482","#90be6d","#f9c74f","#4d96ff"];
let cur=0, state={}, sel=null, db=null;

const tank=document.getElementById('tank'), panel=document.getElementById('panel');

function blank(){return Array.from({length:N},(_,i)=>({id:i,name:"Balık "+(i+1),lvl:0,fed:0}))}
function scale(l){return 1+l*0.11}

/* ---- kalıcı kayıt ---- */
async function load(){
  try{db=await claude.use("db")}catch(e){}
  for(const c of CLASSES){
    let d=null;
    if(db){try{d=(await db.doc("siniflar/"+c).get())?.data}catch(e){}}
    if(!d){try{d=JSON.parse(localStorage.getItem("akv_"+c))}catch(e){}}
    state[c]=(d&&d.fish&&d.fish.length===N)?d.fish:blank();
  }
  build();tokluk();
}
async function save(c){
  try{localStorage.setItem("akv_"+c,JSON.stringify({fish:state[c]}))}catch(e){}
  if(db){try{await db.doc("siniflar/"+c).set({fish:state[c]})}catch(e){}}
}

/* ---- sekmeler ---- */
CLASSES.forEach((c,i)=>{const b=document.createElement('button');b.className='tab'+(i?'':' on');b.textContent=c;
  b.onclick=()=>{cur=i;setTimeout(tokluk,0);[...tabs.children].forEach((t,j)=>t.classList.toggle('on',i===j));build()};tabs.appendChild(b)});

/* ---- balıklar ---- */
let nodes=[];
function fishSVG(color){return `<svg viewBox="0 0 120 70" xmlns="http://www.w3.org/2000/svg">
<path d="M118 35c-14 11-30 16-46 16-18 0-34-7-44-16 10-9 26-16 44-16 16 0 32 5 46 16z" fill="${color}"/>
<path d="M28 35 4 16c-3 12-3 26 0 38z" fill="${color}" opacity=".85"/>
<path d="M62 19c6-8 14-12 20-12 2 6 0 12-6 18z" fill="${color}" opacity=".7"/>
<circle cx="98" cy="31" r="5" fill="#fff"/><circle cx="99.5" cy="31" r="2.6" fill="#10232f"/></svg>`}

function build(){
  nodes.forEach(n=>n.el.remove()); nodes=[];
  const c=CLASSES[cur], W=tank.clientWidth||900, H=tank.clientHeight||500;
  state[c].forEach(f=>{
    if(f.fed===undefined)f.fed=0;
    const el=document.createElement('div'); el.className='fish';
    const img=(window.FISH_IMG&&FISH_IMG[f.id])?`<img src="${FISH_IMG[f.id]}" alt="">`:fishSVG(PAL[f.id%PAL.length]);
    el.innerHTML=img+`<span class="lvl"></span><span class="tag"></span><span class="stat"></span>`;
    el.onclick=()=>open(f);
    tank.appendChild(el);
    const base=W*0.085;
    nodes.push({f,el,base,x:Math.random()*(W-100),y:40+Math.random()*(H-140),
      vx:(Math.random()<.5?-1:1)*(0.5+Math.random()*0.9),vy:(Math.random()-.5)*0.5,ph:Math.random()*6.3,wp:Math.random()*6.3});
  });
  draw();
}
function draw(){
  const W=tank.clientWidth,H=tank.clientHeight;
  nodes.forEach(n=>{
    const s=scale(n.f.lvl), w=n.base*s, h=w*0.58;
    n.el.style.width=w+'px';
    const weak=hungry(n.f);
    n.el.classList.toggle('weak',weak);
    const q=(qEl.value||'').trim().toLowerCase();
    n.el.classList.toggle('hit',!!q&&n.f.name.toLowerCase().includes(q));
    let sp=0, wig=0;
    if(weak){ // 2+ gündür yem yok: kumun üzerinde halsiz, sadece çok hafif kuyruk kıpırtısı
      n.vx*=0.9; n.vy=(H-h-16-n.y)*0.02;
      n.x+=n.vx*0.3; n.y+=n.vy;
      n.wp+=0.02; wig=Math.sin(n.wp)*1.5;
    }else{
      if(mx!==null){const dx=mx-(n.x+w/2),dy=my-(n.y+h/2),d=Math.hypot(dx,dy);
        if(d<260&&d>6){n.vx+=dx/d*0.10;n.vy+=dy/d*0.06;}}
      sp=Math.hypot(n.vx,n.vy);const mxs=2.2;
      if(sp>mxs){n.vx*=mxs/sp;n.vy*=mxs/sp;sp=mxs}
      if(Math.abs(n.vx)<0.25)n.vx=n.vx>=0?0.25:-0.25;
      n.x+=n.vx; n.y+=n.vy+Math.sin(n.ph+=0.03)*0.35;
      n.wp+=0.05+sp*0.05; wig=Math.sin(n.wp)*(6+sp*3);
    }
    if(n.x<0){n.x=0;n.vx*=-1} if(n.x>W-w){n.x=W-w;n.vx*=-1}
    if(n.y<10){n.y=10;n.vy=Math.abs(n.vy)||.2} if(n.y>H-h-20){n.y=H-h-20;n.vy=-Math.abs(n.vy)||-.2}
    if(!weak&&mx===null&&Math.random()<0.004)n.vy=(Math.random()-.5)*0.6;
    const dir=n.vx>0?-1:1; // baş, hareket yönünü gösterir
    n.el.style.transformOrigin='18% 50%';
    n.el.style.transform=`translate(${n.x}px,${n.y}px) scaleX(${dir}) rotate(${wig*(dir<0?1:-1)}deg)`;
    const tg=n.el.querySelector('.tag');
    tg.textContent=n.f.name; tg.classList.toggle('zz',weak);
    tg.style.transform=`translateX(-50%) scaleX(${dir})`;
    const L=n.el.querySelector('.lvl');
    L.textContent=n.f.lvl?'★'.repeat(Math.min(n.f.lvl,5))+(n.f.lvl>5?'+'+n.f.lvl:''):'';
    L.style.transform=`translateX(-50%) scaleX(${dir})`;
    const st=n.el.querySelector('.stat');
    st.style.transform=`translateX(-50%) scaleX(${dir})`;
    if(weak){st.textContent='😟 '+gunSayisi(n.f)+' gündür aç';st.className='stat weak'}
    else if(fedToday(n.f)){st.textContent='🙂 Bugün beslendi';st.className='stat ok'}
    else{st.textContent='😐 Yem bekliyor';st.className='stat due'}
  });
  requestAnimationFrame(draw);
}
addEventListener('resize',()=>build());

/* ---- açlık, fare, tokluk ---- */
const GUN=86400000, qEl=document.getElementById('q');
function gunBasi(t){const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()}
function fedToday(f){return !!f.fed && gunBasi(f.fed)===gunBasi(Date.now())}
function gunSayisi(f){return f.fed?Math.round((gunBasi(Date.now())-gunBasi(f.fed))/GUN):Infinity}
function hungry(f){return gunSayisi(f)>=2} // 2+ gündür yem yok -> halsiz, kumda
let mx=null,my=null;
tank.addEventListener('mousemove',e=>{const r=tank.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top});
tank.addEventListener('mouseleave',()=>{mx=my=null});
tank.addEventListener('touchmove',e=>{const t=e.touches[0],r=tank.getBoundingClientRect();mx=t.clientX-r.left;my=t.clientY-r.top},{passive:true});
tank.addEventListener('touchend',()=>{mx=my=null});
qEl.addEventListener('input',()=>{});
function tokluk(){const c=CLASSES[cur],ok=state[c].filter(fedToday).length,p=Math.round(ok/N*100);
  document.getElementById('pct').textContent='%'+p;
  document.querySelector('#meter i').style.width=p+'%';
  document.querySelector('#meter i').style.background=p>66?'#3a8f4a':p>33?'#c9992b':'#a24545'}
setInterval(tokluk,5000);

/* ---- panel ---- */
function open(f){sel=f;panel.classList.add('on');
  ptitle.textContent=f.name;pname.value=f.name;
  document.getElementById('pbig').innerHTML=(window.FISH_IMG&&FISH_IMG[f.id])?`<img src="${FISH_IMG[f.id]}" alt="">`:fishSVG(PAL[f.id%PAL.length]);
  meta()}
function meta(){const g=sel.fed?Math.floor((Date.now()-sel.fed)/GUN):null;
  pmeta.textContent="Yem: "+sel.lvl+"  •  Boyut: %"+Math.round(scale(sel.lvl)*100)+"  •  "+
  (sel.fed?("Son yem: "+(g===0?"bugün":g+" gün önce")):"Hiç yem verilmedi");
  const st=document.getElementById('pstat');
  if(hungry(sel)){st.textContent='😟 '+gunSayisi(sel)+' gündür aç, halsiz';st.className='stattxt weak'}
  else if(fedToday(sel)){st.textContent='🙂 Bugün beslendi, tok';st.className='stattxt ok'}
  else{st.textContent='😐 Bugün henüz beslenmedi';st.className='stattxt due'}
  tokluk()}
feed.onclick=()=>{if(sel.lvl<MAXLVL)sel.lvl++;sel.fed=Date.now();meta();save(CLASSES[cur]);pop()};
undo.onclick=()=>{if(sel.lvl>0)sel.lvl--;meta();save(CLASSES[cur])};
document.getElementById('save').onclick=()=>{sel.name=(pname.value||"").trim()||sel.name;save(CLASSES[cur]);panel.classList.remove('on')};
close.onclick=()=>panel.classList.remove('on');
panel.onclick=e=>{if(e.target===panel)panel.classList.remove('on')};
pname.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('save').click()});
function pop(){const n=nodes.find(n=>n.f===sel);if(!n)return;
  const fd=document.getElementById('food');fd.style.display='block';
  fd.style.left=(n.x+20)+'px';fd.style.top=(n.y-24)+'px';
  setTimeout(()=>fd.style.display='none',600)}

load();
</script>
</body></html>
